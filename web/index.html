<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Train Sourcing</title
  ><link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231f5f5b%27/%3E%3C/svg%3E"
  /><link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="approval.css" />
  <link rel="stylesheet" href="ui.css" />
  <body>
    <header>
      <a class="brand" href="#/overview" aria-label="Train Sourcing — Overview"><span aria-hidden="true"><i class="msi msi-train"></i></span>Train Sourcing</a>
      <nav id="nav" aria-label="Primary">
        <a href="#/overview"><i class="msi msi-dashboard" aria-hidden="true"></i><span>Overview</span></a
        ><a href="#/discover"><i class="msi msi-explore" aria-hidden="true"></i><span>Discovery</span></a
        ><a href="#/portfolio"><i class="msi msi-bookmarks" aria-hidden="true"></i><span>My suppliers</span></a
        ><a href="#/reports"><i class="msi msi-summarize" aria-hidden="true"></i><span>Reports</span></a
        ><a href="#/approvals"><i class="msi msi-approval" aria-hidden="true"></i><span>Approvals</span></a>
      </nav>
      <div class="header-meta" id="header-count"></div>
      <div class="row header-actions">
        <button class="quiet" data-action="provenance" title="Data & assumptions">
          <i class="msi msi-info" aria-hidden="true"></i><span class="hdr-label">Data & assumptions</span></button
        ><button class="quiet" data-action="tour" title="Guided journey">
          <i class="msi msi-tour" aria-hidden="true"></i><span class="hdr-label">Guided journey</span></button
        ><button class="quiet" data-action="reset" title="Reset">
          <i class="msi msi-restart_alt" aria-hidden="true"></i><span class="hdr-label">Reset</span></button>
      </div>
      <a class="cart-link" href="#/shortlist" aria-label="Shortlist"
        ><i class="msi msi-checklist" aria-hidden="true"></i><span class="cart-label">Shortlist</span
        ><span id="shortlist-count" class="cart-count" hidden></span
      ></a>
    </header>
    <main id="app"></main>
    <div id="tour-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="card-head">
        <h2 id="dialog-title"></h2>
        <button class="icon-button quiet" data-action="close-dialog" aria-label="Close dialog">
          <i class="msi msi-close" aria-hidden="true"></i>
        </button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
    </dialog>
    <div id="print-root"></div>
    <button
      id="chat-launch"
      aria-label="Open Gretel, the sourcing assistant"
      aria-expanded="false"
      aria-controls="chat-drawer"
    >
      <i class="msi msi-chat" aria-hidden="true"></i><span>Ask Gretel</span>
    </button>
    <aside id="chat-drawer" aria-label="Gretel · sourcing assistant" hidden></aside>
    <script type="module" src="app.js"></script>
    <script type="module" src="list-motion.js"></script>
  </body>
</html>
