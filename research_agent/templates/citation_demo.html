<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research TL;DR with citations</title>
<!--
  Reference UI for the chatbot: how to render tldr.tldr_data() with NotebookLM-style citations,
  and tldr.score_explainer() behind a "How was this scored?" button. Framework-free, no external
  assets. Port renderTldr(), showCitation() and showScoring() into web/chat.js.
  Rules: build DOM with textContent (never innerHTML for data), allow only http(s) links.
  Data lives between the TLDR_DATA markers; tldr.render_citation_demo(result) fills it.
-->
<style>
:root{--ink:#1d2a31;--ink2:#56656f;--muted:#87949c;--line:#dce2e6;--bg:#f4f6f7;--teal:#0f6e74;
--red:#d03b3b;--amber:#fab219;--green:#0ca30c;--serious:#ec835a;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;max-width:1080px;margin:16px auto;padding:0 16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.label{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.msg{margin-top:6px}
.cite{display:inline-block;min-width:20px;padding:0 5px;margin:0 1px;border:1px solid var(--line);border-radius:10px;
background:#eef6f6;color:var(--teal);font-size:11px;line-height:18px;text-align:center;cursor:pointer;vertical-align:1px}
.cite:hover,.cite:focus-visible,.cite[aria-pressed="true"]{background:var(--teal);color:#fff;outline:none}
.cite.unverified{background:#fff7e3}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:12px;background:#fff;color:var(--ink)}
.chip .g{margin-right:4px}
.g.red{color:var(--red)}.g.amber{color:#c98a00}.g.green{color:var(--green)}.g.neutral{color:var(--muted)}
.tone-red,.tone-critical{border-color:var(--red)}.tone-amber{border-color:var(--amber)}.tone-green{border-color:var(--green)}
.actions{display:flex;gap:8px;margin-top:10px}
button.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
button.btn:hover{border-color:var(--teal)}
a.btn{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:6px;padding:5px 10px;text-decoration:none;font-size:13px}
.side h3{margin:4px 0 2px;font-size:15px}
.meta{color:var(--ink2);font-size:12px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;margin-left:4px}
.badge.unverified{background:#fff7e3}
.excerpt{background:#f7f9fa;border-left:3px solid var(--teal);padding:8px 10px;margin:10px 0;font-size:13px;white-space:pre-wrap}
mark{background:#fff0b3;color:inherit;padding:0 1px}
.note{color:var(--muted);font-size:12px;font-style:italic}
.empty{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:top}
details{margin:6px 0}summary{cursor:pointer}
@media (max-width:760px){.wrap{grid-template-columns:1fr}}
</style>
</head>

<script>
"use strict";
(function () {
  var raw = document.getElementById("tldr-data").textContent;

  if (!data) { root.textContent = "No research result loaded."; return; }
  var t = data.tldr;
  var GLYPH = { red: "◆", amber: "▲", green: "●", neutral: "○" };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function safeHref(u) {
    try { var p = new URL(u); return p.protocol === "https:" || p.protocol === "http:" ? p.href : null; }
    catch (e) { return null; }
  }

  // Source card: publisher, date, trust badge, the quote highlighted in its context, deep link.
  function showCitation(c, btn) {
    document.querySelectorAll(".cite[aria-pressed]").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
    if (btn) btn.setAttribute("aria-pressed", "true");
    side.replaceChildren();
    side.append(el("div", "label", "Source [" + c.id + "]"));
    var meta = el("div", "meta", c.publisher + " · " + (c.published || "date not stated") + " · accessed " + c.accessed);
    meta.append(el("span", "badge " + c.trust, c.trust_label));
    side.append(meta, el("h3", null, c.title));
    if (c.quote) {
      var ex = el("div", "excerpt");
      ex.append(document.createTextNode(c.excerpt.slice(0, c.quote_start)));
      ex.append(el("mark", null, c.excerpt.slice(c.quote_start, c.quote_end)));
      ex.append(document.createTextNode(c.excerpt.slice(c.quote_end)));
      side.append(ex);
      if (!c.context_found) side.append(el("p", "note", "Quote as stored; the surrounding page text was not saved."));
    } else {
      side.append(el("p", "note", "Corroborating source; no quote stored from it."));
    }
    var href = safeHref(c.link) || safeHref(c.url);
    if (href) {
      var a = el("a", "btn", c.quote ? "Open source at this passage" : "Open source");
      a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
      side.append(a);
    }
    side.focus();
  }

  // "How was this scored?": totals, then per area and sub-score, each line with its citations.
  function showScoring() {
    var s = data.scoring; side.replaceChildren();
    side.append(el("div", "label", "How was this scored?"), el("p", "note", s.note));
    var tot = s.total;
    side.append(el("p", null, "Total: " + (tot.score != null ? tot.score + "/100 · " + tot.level : "not shown") +

      (tot.range ? " · range " + tot.range[0] + "–" + tot.range[1] : "")));
    side.append(el("p", "meta", tot.formula));
    s.areas.forEach(function (a) {
      var d = el("details"), sum = el("summary", null, a.label + ": " + (a.score != null ? a.score + " · " + a.level : "Not assessed"));

      var tb = el("table");
      a.sub_scores.forEach(function (sub) {
        var tr = el("tr");
        tr.append(el("td", null, sub.label), el("td", null, sub.score != null ? String(sub.score) : "Not assessed"));
        var td = el("td");
        (sub.lines || []).forEach(function (ln) {
          var p = el("div", "meta", ln.label + (ln.points != null ? " [" + ln.points + "]" : "") + " — " + ln.rule + " ");
          (ln.citations || []).forEach(function (n) { p.append(citeButton(n, s.citations)); });
          td.append(p);
        });
        if (!sub.lines.length && sub.not_assessed_reason) td.append(el("div", "note", sub.not_assessed_reason));
        tr.append(td); tb.append(tr);
      });
      d.append(tb); side.append(d);

    back.onclick = function () { side.replaceChildren(el("p", "empty", "Select a citation number to see where the point came from.")); };
    side.append(back); side.focus();
  }

  function citeButton(n, table) {
    var c = (table || []).find(function (x) { return x.id === n; });
    var b = el("button", "cite" + (c && c.trust === "unverified" ? " unverified" : ""), String(n) + (c && c.trust === "unverified" ? "🟨" : ""));
    b.type = "button"; b.setAttribute("aria-pressed", "false");
    b.setAttribute("aria-label", "Citation " + n + (c ? ": " + c.publisher : ""));
    b.onclick = function () { if (c) showCitation(c, b); };
    return b;
  }

  function renderTldr() {
    var p = el("p");
    t.segments.forEach(function (sg) {
      if (sg.kind === "pointer") return;
      var span = el("span", null, sg.text.replace(/[.]$/, ""));

    });

      if (c.kind === "flag") ch.append(el("span", "g " + c.colour, GLYPH[c.colour] || "○"));
      if (c.kind === "not_assessed") ch.append(el("span", "g neutral", "○"));
      ch.append(document.createTextNode((c.kind === "not_assessed" ? "Not assessed: " : "") + c.label + (c.date ? " (" + c.date + ")" : "")));
      chips.append(ch);
    });
    root.append(chips);
    var act = el("div", "actions");
    var how = el("button", "btn", "How was this scored?"); how.type = "button"; how.onclick = showScoring;
    act.append(how);
    var href = t.report && t.report.url ? safeHref(t.report.url) : null;
    if (href) { var a = el("a", "btn", t.report.label); a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; act.append(a); }
    root.append(act);
  }
  renderTldr();
