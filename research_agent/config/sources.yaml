# Trusted-source allowlist and denylist for the research agent.
#
# Three kinds of site:
#   trusted     - on a tier below. Searched first. Facts count fully ("company_own" ones are
#                 labelled "company-stated").
#   unverified  - any other site, found by the open-web gap-fill pass. Kept, but marked
#                 "not in our trusted source list"; its facts can at most be a watch item
#                 (see rules.yaml) unless a trusted source confirms them.
#   denylisted  - the "denylist" section at the end. Always dropped, in every search.
#
# A domain also covers
# its subdomains (e.g. "gov.uk" covers "find-and-update.company-information.service.gov.uk").
# When several entries match, the longest (most specific) one wins.
#
# Edit freely: add a line "domain: Publisher name" under the right tier.
# Lower priority number = searched and cited first.
#
# "company_own" is filled in at run time with the confirmed company's own
# website. Facts from it are always labelled "company-stated".

tiers:
  official:
    label: Official registers, regulators and courts
    priority: 1
    domains:
      opensanctions.org: OpenSanctions
      sanctionssearch.ofac.treas.gov: US Treasury (OFAC)
      treasury.gov: US Treasury
      data.europa.eu: EU Open Data Portal
      eur-lex.europa.eu: EUR-Lex (EU law)
      sanctionsmap.eu: EU Sanctions Map
      scsanctions.un.org: UN Security Council sanctions
      gov.uk: UK Government
      insolvenzbekanntmachungen.de: Insolvenzbekanntmachungen (DE)
      unternehmensregister.de: Unternehmensregister (DE)
      handelsregister.de: Handelsregister (DE)
      bundeskartellamt.de: Bundeskartellamt
      bafin.de: BaFin
      sec.gov: US SEC
      justice.gov: US Department of Justice
      gleif.org: GLEIF
      ec.europa.eu: European Commission
      era.europa.eu: EU Agency for Railways
      curia.europa.eu: Court of Justice of the EU

  company_own:
    label: Company's own website (company-stated)
    priority: 2
    domains: {}

  major_news:
    label: Major business press
    priority: 3
    domains:
      reuters.com: Reuters
      apnews.com: AP News
      bloomberg.com: Bloomberg
      ft.com: Financial Times
      wsj.com: The Wall Street Journal
      economist.com: The Economist
      cnbc.com: CNBC
      bbc.com: BBC
      bbc.co.uk: BBC
      dw.com: Deutsche Welle
      handelsblatt.com: Handelsblatt
      faz.net: Frankfurter Allgemeine Zeitung
      sueddeutsche.de: Süddeutsche Zeitung
      spiegel.de: Der Spiegel
      wiwo.de: WirtschaftsWoche
      nzz.ch: Neue Zürcher Zeitung
      lesechos.fr: Les Echos
      lemonde.fr: Le Monde
      ilsole24ore.com: Il Sole 24 Ore
      expansion.com: Expansión
      politico.eu: Politico Europe

  rail_trade:
    label: Rail trade press and associations
    priority: 4
    domains:
      railwaygazette.com: Railway Gazette International
      railjournal.com: International Railway Journal
      railway-technology.com: Railway Technology
      railwayage.com: Railway Age
      globalrailwayreview.com: Global Railway Review
      unife.org: UNIFE

  country_data:
    label: Country risk data
    priority: 5
    domains:
      drmkc.jrc.ec.europa.eu: EU JRC (INFORM risk index)
      worldbank.org: World Bank
      transparency.org: Transparency International
      oecd.org: OECD

# Sites that are never used, even from the open web. Dropped before any model sees them.
# A domain covers its subdomains. A domain cannot be both trusted and denylisted (config error).
# The first 150 entries are also sent to Tavily as exclude_domains (its limit) to save results;
# the code check is what actually enforces this list.
denylist:
  # Anyone can post; no editor, no corrections policy, often anonymous.
  social_media:
    - facebook.com
    - instagram.com
    - x.com
    - twitter.com
    - tiktok.com
    - linkedin.com
    - youtube.com
    - pinterest.com
    - threads.net
    - bsky.app
    - vk.com
    - weibo.com
    - telegram.org
    - t.me
  # User posts and anonymous reviews: unaccountable and easy to fake.
  forums:
    - reddit.com
    - quora.com
    - stackexchange.com
    - glassdoor.com
    - glassdoor.de
    - kununu.com
    - indeed.com
    - trustpilot.com
    - 4chan.org
  # Leaked or stolen data: legally risky to use and impossible to check.
  leak_sites:
    - wikileaks.org
    - ddosecrets.com
    - pastebin.com
  # Re-publish press releases, filings or scraped profiles; the original source should be cited
  # instead. publicnow.com redistributes releases and reports of many companies: from the domain
  # we cannot tell whose document it is, and the original is on the company's own site (trusted,
  # company-stated) or a register, so it is blocked rather than treated as company-stated.
  aggregators:
    - publicnow.com
    - prnewswire.com
    - businesswire.com
    - globenewswire.com
    - einpresswire.com
    - openpr.com
    - newswire.com
    - pressat.co.uk
    - presseportal.de
    - zoominfo.com
    - dnb.com
    - crunchbase.com
    - craft.co
  # User-edited or mass-produced content with no accountable author.
  content_farms:
    - wikipedia.org
    - fandom.com
    - ezinearticles.com
    - hubpages.com
    - answers.com
    - ehow.com
    - scribd.com
