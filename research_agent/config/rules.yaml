# Flag rulebook. Code (not the language model) decides every colour from this file.
#
# The verifier model only labels each verified fact with:
#   event_type  - one of the names below
#   severity    - high | medium | low
# Then these rules decide the colour:
#   red     = serious red flag
#   amber   = watch item
#   green   = strength / positive signal
#   neutral = recorded, not flagged
#
# Rules applied in order:
#   1. Start with the event type's "colour".
#   2. If severity is "low" and the colour is red, it becomes amber.
#   3. If the event happened more than "stale_after_years" ago (default: recency.default_years
#      in settings.yaml), the colour steps down once: red -> amber, amber -> neutral,
#      green -> neutral. "stale_after_years: never" means it never goes stale.
#   4. A fact with colour red and "knockout: true" sets the knock-out verdict.
#
# "area" says which of the six risk areas the fact counts towards. "from_search" means
# the area of the search that found it.

event_types:
  sanctions_listing:        {colour: red,     area: legal,      knockout: true, stale_after_years: never}
  insolvency_filing:        {colour: red,     area: financial,  knockout: true, stale_after_years: 10}
  fraud_or_corruption_case: {colour: red,     area: legal,      stale_after_years: 10}
  regulatory_fine:          {colour: red,     area: legal,      stale_after_years: 5}
  major_lawsuit:            {colour: amber,   area: legal,      stale_after_years: 5}
  # Settlement or consent decree with an authority (often competition law) without an
  # admission or a court finding of wrongdoing. Amber, not red: unlike regulatory_fine no
  # violation was found, but the company accepted obligations, so the buyer should ask about
  # compliance with them. Same 5-year staleness as other legal matters; after that it is
  # shown as context ("older or resolved matter"). Example: US v. Knorr-Bremse & Wabtec (2018).
  antitrust_settlement:     {colour: amber,   area: legal,      stale_after_years: 5}
  forced_labour_or_human_rights_case: {colour: red, area: people, stale_after_years: 5}
  safety_accident:          {colour: red,     area: people}
  # A death at work. Red like safety_accident, but stale after 5 years, not 3: fatal accidents
  # lead to investigations and prosecutions that run for years.
  safety_fatality:          {colour: red,     area: people,     stale_after_years: 5}
  # Breach of an environmental permit or law found by an authority, a spill or emission
  # incident (no fine; a fine is regulatory_fine). Amber: needs follow-up, no penalty yet.
  # Area people (dataset ESG_Performance_Score). 5 years like other legal matters.
  environmental_violation:  {colour: amber,   area: people,     stale_after_years: 5}
  # Personal or customer data stolen or exposed. Amber like cyber_incident (dataset
  # Digital_Security_Score); red only through a regulatory_fine. Default staleness.
  data_breach:              {colour: amber,   area: operations}
  # A customer imposed contract penalties or cancelled a contract for non-performance. Amber like
  # delivery_failure: direct evidence of delivery risk, but one contract, not the company.
  contract_penalty_or_cancellation: {colour: amber, area: operations}
  # Auditor qualified or refused an opinion, restated accounts, or an accounting investigation.
  # Red: the figures every other financial check relies on may be wrong. Low severity -> amber.
  audit_or_accounting_issue: {colour: red,    area: financial,  stale_after_years: 5}
  # On a government forced-labour list (e.g. US UFLPA Entity List; EU Forced Labour Regulation
  # from 2027). Red and knock-out like sanctions_listing: goods can be detained or banned, so
  # sourcing stops until Compliance clears it. Never stale while listed.
  supply_chain_forced_labour_listing: {colour: red, area: people, knockout: true, stale_after_years: never}
  strike_or_labour_dispute: {colour: amber,   area: people}
  product_recall:           {colour: amber,   area: operations}
  cyber_incident:           {colour: amber,   area: operations}
  plant_disruption:         {colour: amber,   area: operations}
  delivery_failure:         {colour: amber,   area: operations}
  credit_downgrade:         {colour: amber,   area: financial}
  profit_warning:           {colour: amber,   area: financial}
  leadership_scandal:       {colour: amber,   area: reputation}
  country_risk_elevated:    {colour: amber,   area: country}
  # Set by code from country data (WGI, CPI) in the best-governed third of the 0-100 scale:
  # measured evidence of a low-risk location, not just silence. See settings.yaml country_data.
  country_risk_low:         {colour: green,   area: country}
  iris_certified:           {colour: green,   area: operations}
  iso_certified:            {colour: green,   area: operations}
  credit_upgrade_or_strong_results: {colour: green, area: financial}
  award_or_major_contract:  {colour: green,   area: reputation}
  company_disclosed_risk:   {colour: neutral, area: from_search}
  other_neutral:            {colour: neutral, area: from_search}

# Overall verdict: first matching line wins.
verdict:
  knockout: "Knock-out risk found — do not proceed without escalation"
  red: "Red flags — review before shortlisting"
  amber: "Watch items only"
  none: "No red flags found in the sources checked"
  no_evidence: "Not enough evidence — no trusted source returned usable results"

# Recommended next steps for the buyer, chosen by area and colour.
# The report shows at most three, most serious first.
next_steps:
  knockout: "Stop and escalate to Compliance before any further engagement with this supplier."
  legal:
    red: "Request a written legal statement on the open matter and its outcome; involve Compliance."
    amber: "Ask the supplier for the status of the pending legal matter."
  financial:
    red: "Request current audited accounts and a credit report before awarding work."
    amber: "Request the latest financial statements or a credit report and review payment terms."
  people:
    red: "Request the incident investigation report and corrective actions; involve HSE."
    amber: "Ask how labour or safety issues affect delivery capacity for your order."
  operations:
    red: "Request quality and delivery evidence (8D reports, IRIS / ISO/TS 22163 certificate)."
    amber: "Ask for corrective-action evidence and current delivery performance for the affected product line."
  country:
    red: "Review country exposure with Compliance and consider an alternate source."
    amber: "Check alternate sourcing options for the affected country."
  reputation:
    red: "Brief your category lead on the controversy before shortlisting."
    amber: "Note the issue in the shortlist memo and monitor."
  none: "Continue standard supplier qualification; this report is not a qualification."
