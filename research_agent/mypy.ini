[mypy]
python_version = 3.12
strict = True
plugins = pydantic.mypy

[mypy-research_agent.tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
check_untyped_defs = True

# Stubs/packages not installable in the offline dev container; harmless elsewhere.
[mypy-yaml.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True
