name: Validate challenge data
on: [push, pull_request]
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_dataset.py
      - run: git diff --exit-code -- docs/data-audit.json
