v class="radar-body">${radar(focus,regionOf(focus))}</div><p class="radar-note">One focused supplier against its system P25–P75 band. Equal weights disclosed in each axis.</p></section><section class="card padded"><h2>Sourcing Copilot</h2><p class="small muted" style="margin:8px 0">Scope: selected IDs, independent of Discovery filters.</p><button class="primary" data-action="financial">Compare financial source score</button><div class="answer" style="margin-top:10px">${state.answer}</div></section></aside></div>`}

function deliveryHistory(r){if(!r||r._research||!isUsed(r))return null;let n=Number(r.supplierID.replace(/\D/g,'')),base=Number(r['Supplier Delivery Rating']);return Array.from({length:12},(_,i)=>Math.round(Math.min(100,Math.max(0,base+Math.sin((n+i)*1.7)*2+(11-i)*((n%7)-3)*.28))*100)/100)}

function toggleCompare(id){if(state.compare.includes(id)){state.compare=state.compare.filter(x=>x!==id);state.compareError=''}else if(state.compare.length>=20){state.compareError='Limit reached: 20 selected. Remove a supplier in Manage selection to make room.';toast(state.compareError)}else{state.compare.push(id);state.compareError=''}if(state.memo)state.memo.stale=true;render()}
function clearRun(){clearTimeout(timer);timer=null}function scheduleRun(){let runId=state.run.id;clearRun();timer=setTimeout(()=>{if(state.run.id!==runId||state.run.status!=='running')return;state.run.stage++;if(state.run.stage>=6){state.run.status='completed';state.reports[runId]=JSON.parse(JSON.stringify(state.run))}if(state.route==='research')render();if(state.run.status==='running')scheduleRun()},1800)}
function startRun(entity){clearRun();let supported=/^siemens(\s+ag)?$/i.test(entity.trim());state.run={id:++runSequence,status:supported?'running':'unsupported',entity:entity.trim(),stage:0,skipped:false};if(supported&&matchMedia('(prefers-reduced-motion: reduce)').matches){state.run.stage=6;state.run.status='completed';state.run.skipped=true;state.reports[state.run.id]=JSON.parse(JSON.stringify(state.run))}render();if(state.run.status==='running')scheduleRun()}
function addResearch(){let run=state.run;if(state.added.length){navigate('supplier/research%3Asiemens-ag');return}if(run.status!=='completed'){toast('Complete the supported saved replay first.');return}if(!$('#scope-ack')?.checked){toast('Acknowledge the entity scope before adding.');return}let region=$('#research-region').value,r={supplierID:'research:siemens-ag','Supplier Name':'Siemens AG',train_region_id:region,_research:true,_report:JSON.parse(JSON.stringify(state.reports[run.id]))};state.added.push(r);state.region=region;run.status='added';toast('Added to '+regionLabel(region)+' · research-only · scores Unknown');render();dialog('Added · separate research record',`<p>Catalog: ${fmt(catalog().length)} records. One research-only record associated with ${esc(regionLabel(region))}; source score means unchanged.</p><p style="margin-top:12px"><a class="button primary" href="#/supplier/research%3Asiemens-ag" data-action="close-link">View added supplier →</a></p><p class="small muted" style="margin-top:12px">Discovery filters preserved. Numeric filters may exclude this unscored record; this direct link remains available.</p>`)}
function showRisk(run=state.run){if(!run||run.status==='unsupported'||run.stage===0){toast('No evidence loaded for this entity.');return}let html=riskDocument(run);dialog('Risk report · limited scope',`<div class="actions" style="margin-bottom:16px"><button class="primary" id="print-risk">Print / Save as PDF</button></div>${html}`);$('#print-risk').onclick=()=>printDoc(html)}function printDoc(html){$('#print-root').innerHTML=html;window.print()}

function renderTour(){let t=state.tour;$('#tour-root').innerHTML=t<0?'':`<aside class="tour"><div class="row spread"><span class="eyebrow">Guided journey · ${t+1} / ${tourSteps.length}</span><button class="quiet small" data-action="end-tour">Close</button></div><h2>${tourSteps[t][0]}</h2><p>${tourSteps[t][1]}</p><div class="row spread"><button data-action="tour-do">${tourSteps[t][2]}</button><button class="primary" data-action="tour-next">${t===tourSteps.length-1?'Finish':'Next →'}</button></div></aside>`}
function provenance(){dialog('Data, scope & assumptions',`<div class="notice">Frontend only · session memory · reload resets changes. No live research, qualification or approvals. Original 10,000-row CSV is immutable.</div><h3 style="margin-top:16px">Synthetic enrichment</h3><p>System/part associations and favorites/previous-use metadata are illustrative. Stable SHA-256 allocation preserves nine quotas. Challenge IDs move to Doors with recorded quota-preserving swaps. Quotas are product choices, not market shares or capability.</p><h3 style="margin-top:16px">Risk mapping</h3><p>radar-v1-equal: each axis is the equal-weight mean of listed source scores. Higher is worse, 0–100. Unknowns excluded. Source Total_Risk_Index unchanged; original total weights unavailable. System bands use scored records only.</p><p class="small" style="margin-top:12px;overflow-wrap:anywhere">Source: ${esc(payload.source)}<br>SHA-256: ${esc(payload.sha256)}</p><h3 style="margin-top:16px">Full reproducibility manifest</h3><pre>${esc(JSON.stringify(manifest,null,2))}</pre>`)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;switch(a){case'region':selectRegion(b.dataset.region);break;case'reset-view':train?.resetView();break;case'discover-region':state.filters.region=state.region;state.page=1;navigate('discover');break;case'favorite':state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);if(state.memo?.candidate===id){state.memo.relationship=tags(get(id)).replace(/<[^>]*>/g,' ')||'Neither';state.memo.rev++;state.memo.stale=true}render();break;case'detail':navigate('supplier/'+encodeURIComponent(id));break;case'recommend':newMemo(id);break;case'radar-table':state.tableRadar=!state.tableRadar;render();break;case'mapping':dialog('Six derived axes · equal weights',radar(get(state.focus)||get('SUPP_00012'),state.region,true)+'<p class="screen-note">0 = no risk, 100 = maximum risk. Financial (derived) is distinct from supplied Financial_Health_Score. Source total unchanged.</p>');break;case'financial':financial();break;case'why-high':whyHigh();break;case'research-mode':navigate('research');break;case'clear-filters':state.filters={q:'',region:'',risk:'',delivery:'',favorite:false,used:false,sort:'total'};state.page=1;render();break;case'prev-page':state.page--;render();break;case'next-page':state.page++;render();break;case'compare':state.focus=state.compare[0];navigate('compare');break;case'compare-focus':state.focus=id;render();break;case'toggle-compare':case'remove-compare':toggleCompare(id);break;case'manage-compare':dialog('Comparison selection · '+state.compare.length+' / 20',`<p>Selections stay across pages and filters. Remove a record to free a slot.</p><div class="selection-tags">${state.compare.map(x=>`<button data-action="remove-dialog-compare" data-id="${esc(x)}">${esc(x)} ×</button>`).join('')||'<p>No selections.</p>'}</div>`);break;case'remove-dialog-compare':toggleCompare(id);b.remove();$('#dialog-title').textContent='Comparison selection · '+state.compare.length+' / 20';break;case'close-dialog':case'close-link':$('#dialog').close();break;case'source-cells':cells(id);break;case'provenance':provenance();break;case'load-siemens':startRun('Siemens AG');clearRun();state.run.stage=6;state.run.status='completed';state.run.skipped=true;state.reports[state.run.id]=JSON.parse(JSON.stringify(state.run));render();break;case'pause-run':if(state.run.status==='running'){clearRun();state.run.status='paused'}else if(state.run.status==='paused'){state.run.status='running';scheduleRun()}render();break;case'cancel-run':clearRun();state.run.status='cancelled';render();break;case'complete-run':clearRun();state.run.stage=6;state.run.status='completed';state.run.skipped=true;state.reports[state.run.id]=JSON.parse(JSON.stringify(state.run));render();break;case'add-research':addResearch();break;case'risk-report':showRisk();break;case'saved-report':showRisk(state.reports[b.dataset.run]||state.added[0]?._report);break;case'print-memo':state.memo.preview=memoDocument(state.memo);printDoc(state.memo.preview);break;case'update-selection':state.memo.selection=state.compare.slice();state.memo.filters=JSON.parse(JSON.stringify(state.filters));state.memo.rev++;state.memo.stale=false;render();break;case'tour':state.tour=0;renderTour();break;case'end-tour':state.tour=-1;renderTour();break;case'tour-next':state.tour=state.tour===tourSteps.length-1?-1:state.tour+1;renderTour();break;case'tour-do':tourSteps[state.tour][3]();break;case'reset':if((state.memo||state.added.length||state.run.id)&&!confirm('Reset this session? Drafts, research records, notes and selections will be discarded; replay stops.'))return;clearRun();state=initial();statCache.clear();$('#dialog').close();$('#print-root').innerHTML='';navigate('overview');toast('Reset complete · original 10,000 records restored.');break}});
document.addEventListener('click',e=>{if(e.target.closest('button,a,input,select'))return;let c=e.target.closest('[data-focus]');if(c&&state.focus!==c.dataset.focus){state.focus=c.dataset.focus;render()}});document.addEventListener('keydown',e=>{let c=e.target.closest('[data-focus]');if(c&&e.key==='Enter'){state.focus=c.dataset.focus;render()}});document.addEventListener('focusin',e=>{let b=e.target.closest('[data-action="region"]');if(b)train?.highlight(b.dataset.region)});document.addEventListener('focusout',e=>{if(e.target.closest('[data-action="region"]'))train?.highlight(null)});
