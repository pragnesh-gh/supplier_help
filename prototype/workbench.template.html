in{min-width:0}.switcher{position:fixed;left:50%;bottom:17px;transform:translateX(-50%);z-index:20;background:#173448;color:white;box-shadow:0 5px 25px #17344840;border-radius:30px;display:flex;align-items:center;padding:5px 8px;gap:8px;white-space:nowrap}.switcher button{border:0;background:transparent;color:#fff;font-size:20px;padding:3px 10px}.switcher span{font-size:12px;min-width:180px;text-align:center}.toast{position:fixed;right:25px;bottom:85px;background:#173448;color:#fff;z-index:50;padding:12px 18px;max-width:400px;box-shadow:0 5px 20px #0002;border-radius:7px}.toast:empty{display:none}dialog{border:1px solid var(--line);border-radius:12px;padding:0;max-width:850px;width:calc(100% - 32px);max-height:90vh;color:var(--ink);box-shadow:0 20px 80px #102b3b40}dialog::backdrop{background:#122b4059}.dialog-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:start;justify-content:space-between;gap:15px}.dialog-body{padding:20px 24px;overflow:auto;max-height:73vh}.detail-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail-metric{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:9px 0;font-size:12px}.detail-metric button{padding:0;background:none;border:0;font-size:12px;text-align:left;font-weight:400}.detail-metric button:hover{text-decoration:underline}.scorebar{width:100%;height:6px;background:#dce8eb;border-radius:4px;margin-top:7px}.scorebar i{display:block;height:6px;background:#a8bfc6;border-radius:4px}.detail-box{padding:10px 14px;background:#f4f7f9;margin:10px 0;border-radius:7px}.detail-box h3{margin-bottom:5px}.footnote{font-size:11px;color:var(--muted);margin-top:20px}.empty{text-align:center;padding:40px 20px;color:var(--muted)}.source-meta{font-size:12px;overflow-wrap:anywhere}.source-meta dt{font-weight:700;margin-top:12px}.source-meta dd{margin:3px 0}.quickstats{display:flex;gap:28px;padding:15px 0 20px}.quickstats b{display:block;font-size <div class="masthead"><div class="brand">Supplier workbench <small> / Procurement decision support</small></div><span class="prototype-label">OFFLINE PROTOTYPE · In-memory session</span></div>
<div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="detail-dialog" aria-labelledby="detail-title"></dialog><dialog id="source-dialog" aria-labelledby="source-title"></dialog>
<div class="switcher" aria-label="Prototype layout switcher"><button data-action="variant-prev" aria-label="Previous layout">←</button><span id="variant-label"></span><button data-action="variant-next" aria-label="Next layout">→</button></div>
<script id="source-data" type="application/json">__DATA_PAYLOAD__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('source-data').textContent);
const C=Object.fromEntries(DATA.columns.map((k,i)=>[k,i])), ROWS=DATA.rows, BYID=new Map(ROWS.map((r,i)=>[r[0],{row:r,line:i+2}]));
const RISK=DATA.columns.filter(k=>k==='Total_Risk_Index'||k.endsWith('_Score'));
const OPS=['Supplier Delivery Rating','Order Confirmation Rate','Order Change Rate','Purchase Order Volume (EUR)'];
const SEED=['SUPP_00012','SUPP_00450','SUPP_00731'];
const VIEWS=['explore','compare','ask','research','decision'];
const TITLES={explore:'Explore suppliers',compare:'Compare shortlist',ask:'Ask the data',research:'Company research',decision:'Decision & export'};
const VARIANTS={A:'Data workbench',B:'Guided sourcing',C:'Comparison review'};
const LABELS={Total_Risk_Index:'Total risk index',Industry_Benchmark_Score:'Industry benchmark',Media_Sentiment_Score:'Media sentiment',External_Intelligence_Score:'External intelligence',Sub_Tier_Visibility_Score:'Sub-tier visibility',Labor_Stability_Score:'Labor stability',Financial_Health_Score:'Financial health risk',Compliance_Risk_Score:'Compliance risk',Safety_Incident_Score:'Safety incidents',Environmental_Exposure_Score:'Environmental exposure',ESG_Performance_Score:'ESG performance risk',Digital_Security_Score:'Digital security',Operational_Resilience_Score:'Operational resilience',Market_Sentiment_Score:'Market sentiment',Quality_Risk_Score:'Quality risk',Governance_Risk_Score:'Governance risk',Geopolitical_Risk_Score:'Geopolitical risk',Political_Stability_Score:'Political stability',Credit_Rating_Score:'Credit rating risk'};
const DEFS={Financial_Health_Score:'Risk related to financial stability, liquidity and bankruptcy. The source defines lower values as lower risk.',ESG_Performance_Score:'Environmental, social and governance risk. Despite the source name, 0 means no risk and 100 maximum risk.',Total_Risk_Index:'The source describes a weighted average of risk categories. Exact weights are not supplied.', 'Supplier Delivery Rating':'Operational performance: delivery timeliness and accuracy, expressed as a percentage. Higher indicates stronger delivery performance.', 'Order Confirmation Rate':'Operational performance: orders confirmed within the requested timeframe (%).', 'Order Change Rate':'Operational metric: frequency of order changes (%).', 'Purchase Order Volume (EUR)':'Historical purchase-order exposure in EUR. This is not a unit price or supplier quote.'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=k=>LABELS[k]||k;
const val=(r,k)=>r[C[k]];
const fmt=(x,d=0)=>Number(x).toLocaleString('en-GB',{maximumFractionDigits:d,minimumFractionDigits:d});
const initial=()=>({ids:[...SEED],view:'explore',q:'',level:'',sourcing:'',complexity:'',delivery:'',sort:'Total_Risk_Index',direction:'asc',page:1,allMetrics:false,context:'Door-system sourcing · early risk screening',question:'Which selected supplier has the lowest financial risk?',answer:null,dictation:false,transcript:'Which of SUPP_00012, SUPP_00450 and SUPP_00731 has the lowest financial risk?',company:'',researchStage:0,followup:false,preferred:'SUPP_00731',alternate:'SUPP_00012',rationale:'',nextAction:'Request technical capability, qualification and current financial evidence.',reviewer:'',recorded:null,demo:null,demoStep:0});
let state=initial();
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!VARIANTS[variant])variant='A';
// Small deterministic domain module. It only operates on supplied data/state.
const Core={
 filtered(s){const q=s.q.trim().toLowerCase();return ROWS.filter(r=>(!q||r[0].toLowerCase().includes(q)||r[1].toLowerCase().includes(q))&&(!s.level||val(r,'Total_Risk_Index_Level')===s.level)&&(!s.sourcing||val(r,'Sourcing Risk Level')===s.sourcing)&&(!s.complexity||val(r,'Supply Chain Complexity')===s.complexity)&&(!s.delivery||val(r,'Supplier Delivery Rating')>=Number(s.delivery))).sort((a,b)=>((val(a,s.sort)-val(b,s.sort))*(s.direction==='asc'?1:-1))||a[0].localeCompare(b[0]));},
 answer(q,ids){const typed=[...new Set((q.toUpperCase().match(/SUPP_\d+/g)||[]))];const missing=typed.filter(id=>!BYID.has(id));if(missing.length)return {type:'unsupported',title:'Check the supplier IDs',text:'No source row exists for '+missing.join(', ')+'. Use the exact supplierID, including five digits. No replacement identity was assumed.'};if(/(why|explain|reason)/i.test(q)&&typed.includes('SUPP_00018')){const r=BYID.get('SUPP_00018').row;return {type:'high',title:'SUPP_00018 has a source total of 80 / Critical',ids:['SUPP_00018'],metric:'Total_Risk_Index',high:RISK.filter(k=>k!=='Total_Risk_Index').sort((a,b)=>val(r,b)-val(r,a)).slice(0,5),text:'The row contains high observed risks in several categories. These are observations, not calculated contributions to the total: the source does not provide aggregate weights. The data does not identify the underlying events or a current legal company.'};}if(/financ/i.test(q)&&/(lowest|least|best|minim)/i.test(q)){const chosen=typed.length?typed:ids;if(!chosen.length)return {type:'unsupported',title:'Choose suppliers first',text:'Select up to 20 suppliers or type exact supplier IDs to compare Financial_Health_Score.'};if(chosen.length>20)return {type:'unsupported',title:'Comparison limit reached',text:'Ask about up to 20 suppliers at a time.'};const ordered=chosen.map(id=>BYID.get(id).row).sort((a,b)=>val(a,'Financial_Health_Score')-val(b,'Financial_Health_Score'));const min=val(ordered[0],'Financial_Health_Score');const winners=ordered.filter(r=>val(r,'Financial_Health_Score')===min).map(r=>r[0]);return {type:'financial',title:winners.join(' and ')+' · lowest financial risk in this set',ids:ordered.map(r=>r[0]),metric:'Financial_Health_Score',text:'Financial_Health_Score is '+min+' / 100 for '+winners.join(', ')+'. Lower means lower risk. This is a comparison of the specified rows, not a qualification or award recommendation.'};}return {type:'unsupported',title:'This offline question is not supported',text:'I can compare the lowest financial risk for selected or typed supplier IDs, or explain observed risk categories for SUPP_00018. This dataset cannot establish component capability, company identity, current news or qualification. Use Company research for a separately named real company.'};}
};
const selectedRows=()=>state.ids.map(id=>BYID.get(id).row);
function risk(r,k){return `<span class="metric-number">${fmt(val(r,k))}</span><span class="risk ${String(val(r,k+'_Level')).toLowerCase()}">${esc(val(r,k+'_Level'))}</span>`;}
function option(v,text,current){return `<option value="${esc(v)}"${String(v)===String(current)?' selected':''}>${esc(text)}</option>`;}
function filterContext(){return [state.q&&'Search: '+state.q,state.level&&'Total: '+state.level,state.sourcing&&'Sourcing: '+state.sourcing,state.complexity&&'Chain: '+state.complexity,state.delivery&&'Delivery ≥ '+state.delivery+'%'].filter(Boolean).join(' · ')||'All suppliers · no filters';}
function rankContext(){return label(state.sort)+' · '+(state.direction==='asc'?'lowest first':'highest first');}
function stateStrip(){return `<div class="state-strip"><div><strong>${state.ids.length} / 20 selected</strong> · ${esc(filterContext())}<br>Rank: ${esc(rankContext())}</div><div class="row"><button class="small" data-action="csv">Download shortlist CSV</button><button class="small primary" data-action="nav" data-view="compare">Compare ${state.ids.length}</button></div></div>`;}
function nav(cls='tabs'){return `<nav class="${cls}" aria-label="Sourcing workflow">${VIEWS.map((v,i)=>`<button data-action="nav" data-view="${v}" class="${state.view===v?'active':''}" aria-current="${state.view===v?'page':'false'}">${cls==='step-rail'?'<b>'+(i+1)+'</b>':''}<span>${TITLES[v]}${v==='compare'?'<span class="count">'+state.ids.length+'</span>':''}</span></button>`).join('')}${cls==='step-rail'?`<div class="guide-summary"><strong>Your working state</strong><p>${state.ids.length} candidates selected. Filters and notes stay with you as you move between steps.</p><p>Qualification: unknown<br>Data as-of: not supplied</p></div>`:''}</nav>`;}
function demo(){const steps=['Compare the three seeded suppliers','Open demo dictation and review the editable transcript','Use the reviewed transcript to ask about financial risk','Inspect the observed risks of SUPP_00018','Prepare a separate Siemens AG research plan','Review the saved risk disclosures','Complete the report and inspect its saved follow-up','Draft a recommendation and next action','Download the draft memo'];return `<details class="demo" ${state.demo?'open':''}><summary>Try a guided demo · free exploration is always available</summary><div class="row"><button class="small" data-action="demo-start">Start buyer journey</button><button class="small" data-action="demo-cap">Try the 20-supplier limit</button><button class="small" data-action="demo-unsupported">Try an unsupported question</button></div>${state.demo==='journey'?`<div class="demo-step"><p><strong>Step ${Math.min(state.demoStep+1,steps.length)} / ${steps.length}</strong> · ${esc(steps[Math.min(state.demoStep,steps.length-1)])}</p><button class="small primary" data-action="demo-next">${state.demoStep>=steps.length?'Run again':'Do this step →'}</button></div>`:''}<p class="muted" style="margin-top:9px">Starting a scenario resets to a predictable state. Downloads are real; questions, research and dictation are simulated.</p></details>`;}
function tray(){return `<section class="tray" aria-label="Persistent shortlist"><div class="row space"><strong>Shortlist · ${state.ids.length} / 20</strong><button class="small quiet" data-action="clear-selection" ${state.ids.length?'':'disabled'}>Clear selection</button></div><div class="chips">${state.ids.length?state.ids.map(id=>`<span class="chip"><button data-action="detail" data-id="${id}" aria-label="Inspect ${id}">${id}</button><button data-action="remove" data-id="${id}" aria-label="Remove ${id}">×</button></span>`).join(''):'No suppliers selected. Add candidates from the table.'}</div><p class="muted" style="font-size:11px;margin-top:8px">Selections remain when filters change. Maximum 20 suppliers.</p></section>`;}
function candidates(){const rows=Core.filtered(state),pages=Math.max(1,Math.ceil(rows.length/25));state.page=Math.min(state.page,pages);const pageRows=rows.slice((state.page-1)*25,state.page*25);return `<div class="card"><div class="card-head"><div><span class="eyebrow">Candidate discovery</span><h2>Explore 10,000 supplier records</h2><p>Filter the supplied risk data, then build a comparison set.</p></div><span class="count">${fmt(rows.length)} results</span></div><div class="filter-grid"><label class="field search">Search supplier ID or name<input id="supplier-search" data-field="q" value="${esc(state.q)}" placeholder="e.g. SUPP_00012 or Logistics" type="search"></label><label class="field">Total risk label<select data-field="level">${option('','All risk labels',state.level)}${['Low','Medium','High','Critical'].map(v=>option(v,v,state.level)).join('')}</select></label><label class="field">Sourcing risk<select data-field="sourcing">${option('','All levels',state.sourcing)}${['Low','Medium','High'].map(v=>option(v,v,state.sourcing)).join('')}</select></label><label class="field">Supply-chain complexity<select data-field="complexity">${option('','All complexity',state.complexity)}${[...new Set(ROWS.map(r=>val(r,'Supply Chain Complexity')))].sort().map(v=>option(v,v,state.complexity)).join('')}</select></label><label class="field">Delivery floor %<input data-field="delivery" type="number" min="0" max="100" step="0.1" value="${esc(state.delivery)}" placeholder="0–100"></label></div><div class="rankbar"><div class="row"><label>Rank by <select data-field="sort" aria-label="Numeric ranking metric">${[...RISK,...OPS].map(k=>option(k,label(k),state.sort)).join('')}</select></label><select data-field="direction" aria-label="Ranking direction">${option('asc','Lowest first',state.direction)}${option('desc','Highest first',state.direction)}</select></div><button class="small quiet" data-action="clear-filters">Clear filters</button></div><div id="candidate-results">${candidateTable(pageRows,rows.length,pages)}</div>${tray()}<p class="footnote">Risk scores: 0 = no risk, 100 = maximum risk. Delivery and confirmation are operational percentages. Click a supplier for all 19 risk metrics and source cells.</p></div>`;}
function candidateTable(rows,count,pages){const extra=!['Total_Risk_Index','Financial_Health_Score','Supplier Delivery Rating'].includes(state.sort);return `<div class="table-scroll"><table aria-label="Supplier search results"><thead><tr><th><span class="sr-only">Select</span></th><th>Supplier</th><th>Total risk</th><th>Financial risk</th><th>Delivery %</th>${extra?'<th>'+esc(label(state.sort))+'</th>':''}<th>Sourcing risk</th></tr></thead><tbody>${rows.map(r=>`<tr class="${state.ids.includes(r[0])?'selected':''}"><td><input type="checkbox" data-select="${r[0]}" aria-label="Select ${r[0]}" ${state.ids.includes(r[0])?'checked':''}></td><td><button class="link-button" data-action="detail" data-id="${r[0]}"><span class="supplier-name">${esc(r[1])}</span><span class="supplier-id">${r[0]}</span></button></td><td>${risk(r,'Total_Risk_Index')}</td><td>${risk(r,'Financial_Health_Score')}</td><td>${fmt(val(r,'Supplier Delivery Rating'),2)}%</td>${extra?`<td><button class="sourcecell quiet small" data-action="source" data-id="${r[0]}" data-key="${state.sort}">${RISK.includes(state.sort)?risk(r,state.sort):fmt(val(r,state.sort),2)+(state.sort.includes('EUR')?' EUR':'%')}</button></td>`:''}<td>${esc(val(r,'Sourcing Risk Level'))}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No suppliers match. Clear a filter or try another ID or name.</td></tr>'}</tbody></table></div><div class="pager"><span>${count?'Rows '+fmt((state.page-1)*25+1)+'–'+fmt(Math.min(state.page*25,count))+' of '+fmt(count):'0 matching rows'} · page ${state.page} / ${pages}</span><div class="row"><button class="small" data-action="page-prev" ${state.page<=1?'disabled':''}>← Previous</button><button class="small" data-action="page-next" ${state.page>=pages?'disabled':''}>Next →</button></div></div>`;}
function compare(compact=false){const rows=selectedRows(),metrics=state.allMetrics?RISK:['Total_Risk_Index','Financial_Health_Score','Compliance_Risk_Score','ESG_Performance_Score','Operational_Resilience_Score','Credit_Rating_Score'];return `<section class="card" id="comparison"><div class="card-head"><div><span class="eyebrow">Side-by-side evidence</span><h2>${compact?'Your comparison at a glance':'Compare your shortlist'}</h2><p>${rows.length} selected suppliers · values and labels come from the source CSV.</p></div><button class="small" data-action="toggle-metrics">${state.allMetrics?'Show key metrics':'Show all 19 risk metrics'}</button></div><div class="legend">Risk scores: <strong>0 = no risk · 100 = maximum risk</strong>. Financial health and ESG follow this same direction.</div>${rows.length?`<div class="table-scroll matrix"><table aria-label="Selected supplier comparison"><thead><tr><th>Metric / source cell</th>${rows.map(r=>`<th><button class="link-button" data-action="detail" data-id="${r[0]}"><span class="name">${esc(r[1])}</span><span class="supplier-id">${r[0]}</span></button><button class="small quiet" data-action="remove" data-id="${r[0]}" aria-label="Remove ${r[0]}">Remove</button></th>`).join('')}</tr></thead><tbody>${metrics.map(k=>`<tr><td title="${esc(k)}">${label(k)}</td>${rows.map(r=>`<td><button class="sourcecell" data-action="source" data-id="${r[0]}" data-key="${k}" aria-label="Source for ${r[0]} ${label(k)}">${risk(r,k)}</button></td>`).join('')}</tr>`).join('')}<tr class="group"><td>Operational metrics · separate scale</td>${rows.map(()=>'<td></td>').join('')}</tr>${OPS.map(k=>`<tr><td>${k==='Purchase Order Volume (EUR)'?'PO exposure · EUR':k+(k.includes('EUR')?'':' (%)')}</td>${rows.map(r=>`<td><button class="sourcecell" data-action="source" data-id="${r[0]}" data-key="${k}">${k.includes('EUR')?'€':''}${fmt(val(r,k),2)}${k.includes('EUR')?'':'%'}</button></td>`).join('')}</tr>`).join('')}${['Sourcing Risk Level','Supply Chain Complexity'].map(k=>`<tr><td>${k}</td>${rows.map(r=>`<td><button class="sourcecell" data-action="source" data-id="${r[0]}" data-key="${k}">${esc(val(r,k))}</button></td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">Your shortlist is empty. <button data-action="nav" data-view="explore">Explore suppliers</button></div>'}<div class="notice">A lower risk score does not establish technical suitability or qualification. Weights and a data as-of date were not supplied. Click any value to inspect its row and column.</div><div class="row"><button class="small primary" data-action="ask-financial">Which has the lowest financial risk?</button><button class="small" data-action="inspect-high">Inspect SUPP_00018</button></div></section>`;}
function evidence(ids,keys){return `<details class="evidence-toggle"><summary>Inspect exact source rows and columns</summary><ul class="evidence-list">${ids.map(id=>keys.map(k=>`<li><button class="quiet small" data-action="source" data-id="${id}" data-key="${k}">${id} · row ${BYID.get(id).line} · ${esc(k)} = ${esc(val(BYID.get(id).row,k))}</button></li>`).join('')).join('')}</ul><p class="mono" style="font-size:10px;overflow-wrap:anywhere">SHA256 ${DATA.sha256}</p></details>`;}
function answerCard(a){if(!a)return '';let body=`<p>${esc(a.text)}</p>`;if(a.type==='financial')body+=`<table aria-label="Financial risk answer evidence"><thead><tr><th>Supplier</th><th>Financial risk / 100</th></tr></thead><tbody>${a.ids.map(id=>`<tr><td>${id}</td><td>${risk(BYID.get(id).row,a.metric)}</td></tr>`).join('')}</tbody></table>${evidence(a.ids,[a.metric])}`;if(a.type==='high')body+=`<ul class="unknowns">${a.high.map(k=>`<li>${label(k)}: ${risk(BYID.get('SUPP_00018').row,k)}</li>`).join('')}</ul>${evidence(a.ids,['Total_Risk_Index',...a.high])}`;return `<section class="answer" aria-live="polite"><h3>${esc(a.title)}</h3>${body}<p class="muted" style="font-size:11px;margin-top:10px">Deterministic offline answer · based only on supplied CSV rows</p></section>`;}
function ask(compact=false){return `<section class="card ${compact?'assistant':''}"><span class="eyebrow">Grounded data assistant</span><h2>${compact?'Ask about the evidence':'Ask a question, inspect the cells'}</h2><p class="muted" style="font-size:12px;margin-top:6px">Scope: ${state.ids.length} selected suppliers. Type exact IDs to use a different set.</p><form class="composer" data-form="ask"><label class="field">Your question<textarea name="question" id="question-input" placeholder="Which selected supplier has the lowest financial risk?">${esc(state.question)}</textarea></label><div class="row"><button class="primary" type="submit">Ask the data</button><button type="button" class="small" data-action="dictation">Demo dictation</button></div></form>${state.dictation?`<div class="dictation"><strong>Simulated transcript</strong><p>No microphone is used. Edit before sending it to the question composer.</p><label class="field">Editable transcript<textarea id="transcript-input" data-field="transcript">${esc(state.transcript)}</textarea></label><div class="row" style="margin-top:8px"><button class="small primary" data-action="use-transcript">Use transcript</button><button class="small" data-action="cancel-transcript">Cancel</button></div></div>`:''}<div style="margin-top:10px"><button class="suggestion" data-action="ask-financial">Lowest financial risk</button><button class="suggestion" data-action="ask-high">Why is SUPP_00018 high?</button></div>${answerCard(state.answer)}${compact?'':`<div class="notice">Supported demo intents: lowest financial risk for selected / typed IDs; observed high categories for SUPP_00018. Other questions receive a visible fallback.</div>`}<details class="evidence-toggle"><summary>How this prototype answers</summary><p class="muted" style="font-size:12px;margin-top:8px">Exact lookups and rankings run locally. No model is connected. A later server adapter may use Nemotron for language and Jev / System One or the Decisions API for optional evidence triage. Neither would determine supplier qualification.</p></details></section>`;}
const REPORT_URL='https://assets.new.siemens.com/siemens/assets/api/uuid:428ea18a-e7ab-4f93-a160-33908f1c3540/Siemens-Annual-Report-2025.pdf';
const ASSURANCE_URL='https://www.mobility.siemens.com/global/en/portfolio/digital-solutions-software/cybersecurity/certification-standards.html';
const FINDINGS=[
{title:'Supplier cybersecurity verification',category:'Digital security',text:'Siemens describes the effort required to verify cybersecurity across a distributed supplier network.',page:28,next:'Review component-specific cybersecurity evidence.'},
{title:'Critical supply concentration',category:'Operational resilience',text:'The report identifies potential delays, cost increases and quality issues when critical supplies depend on limited sources.',page:29,next:'Request alternate-source and continuity evidence.'},
{title:'Long-term project delivery',category:'Delivery and contracts',text:'Siemens describes cost, execution and penalty exposure in long-term projects, including fixed-price contracts.',page:29,next:'Review capacity, schedule assumptions and change controls.'}
];
function researchLines(){const lines=['# Saved company-research example: Siemens AG / Siemens Group','','Scope: historical corporate risk disclosures, not a comprehensive adverse-news search.','Prepared/source-checked: 18 October 2026. No live crawl.','Report period: FY ended 30 September 2025. Document dated December 2025; exact first-publication day unverified.','No link to anonymized SUPP_* suppliers. No numeric risk/severity assigned.',''];if(state.researchStage>=2){for(const f of FINDINGS)lines.push('## '+f.title,'Status: company-disclosed potential risk; no specific incident conclusion.',f.text,'Source: '+REPORT_URL+'#page='+f.page,'Proposed buyer follow-up: '+f.next,'');}else lines.push('Plan only: observations have not been reviewed in this session.');if(state.followup)lines.push('## Bounded follow-up: supplier cybersecurity','Question: What public assurance process addresses this exposure for rail?','Saved result: Siemens Mobility describes checks according to supplier criticality, from declarations to questionnaires and evidence. This establishes a stated process, not that any supplier passed it.','Source: '+ASSURANCE_URL,'Page publication date not supplied; checked 18 October 2026.','Outcome: Assurance process found; supplier evidence still needed.');lines.push('','Unknowns: current incidents, legal entity/contract scope, supplier-specific evidence and completeness of public coverage.','Buyer note: '+(state.researchNote||'Not recorded'));return lines;}
function research(){const match=/^siemens\s+ag$/i.test(state.company.trim());const started=state.researchStage>0;return `<section class="card"><div class="card-head"><div><span class="eyebrow">Separate real-company research</span><h2>From a company name to reviewable evidence</h2><p>Keep public-company findings separate from anonymized supplier records.</p></div><span class="risk">Saved research example</span></div><form data-form="research"><div class="row" style="align-items:end"><label class="field" style="flex:1">Real legal company name<input id="company-input" name="company" value="${esc(state.company)}" placeholder="e.g. Siemens AG" required></label><button class="primary" type="submit">Prepare research plan</button><button type="button" data-action="research-example">Load Siemens AG example</button></div></form><ol class="research-plan"><li><span class="stepno">01 · Scope and identity</span>Siemens AG / Siemens Group. Confirm the legal entity and contract scope in a live review.</li><li><span class="stepno">02 · Review disclosures</span>Read three saved observations from the official FY2025 report, with page links.</li><li><span class="stepno">03 · Follow a concern</span>Inspect rail supplier-assurance guidance, then record remaining evidence gaps.</li></ol>${started&&!match?`<div class="notice amber"><strong>No offline fixture for ${esc(state.company)}.</strong><p>No company facts or risk conclusions have been generated. Confirm identity before live research. Load Siemens AG to inspect the saved workflow.</p></div>`:''}${started&&match?`<div class="research-result"><div class="row space"><span class="status">${state.researchStage===1?'Plan ready':state.researchStage===2?'Three disclosures to review':'Limited-scope report ready'}</span><span class="risk">No live crawl</span></div><h3 style="margin-top:12px">Siemens AG / Siemens Group</h3><p class="muted" style="margin-top:8px">FY ended 30 September 2025 · report dated December 2025 · source-checked 18 October 2026. Historical disclosures do not establish current incidents.</p>${state.researchStage===1?`<div class="notice">Proposed source: <a href="${REPORT_URL}#page=28" target="_blank" rel="noopener noreferrer">Siemens Report 2025, operational risks ↗</a>. Review cybersecurity, supply concentration and project delivery; then follow one concern to rail-specific guidance.</div>`:`<div class="stack" style="margin-top:16px">${FINDINGS.map(f=>`<article class="detail-box"><div class="row space"><h3>${f.title}</h3><span class="risk">${f.category}</span></div><p style="margin-top:7px">${f.text}</p><p class="muted" style="font-size:12px;margin-top:8px">Company-disclosed exposure · no specific incident established</p><p style="margin-top:7px"><a href="${REPORT_URL}#page=${f.page}" target="_blank" rel="noopener noreferrer">S1 · official report, PDF page ${f.page} ↗</a></p><p class="muted" style="font-size:12px;margin-top:6px">Suggested next action: ${f.next}</p></article>`).join('')}</div>`}${state.researchStage<3?`<button class="primary small" data-action="research-advance">${state.researchStage===1?'Review saved source observations':'Finish limited-scope report'}</button>`:`<div class="notice teal"><strong>Three disclosed exposures · current evidence still needed</strong><p>No supplier rating or approval follows from these disclosures. This example covers the report excerpts, not a comprehensive news or regulatory search.</p></div><button class="small" data-action="followup">Investigate cybersecurity assurance · saved follow-up</button>`}${state.followup?`<div class="notice"><strong>Assurance process found · supplier evidence still needed</strong><p>Trigger: the report describes supplier cybersecurity verification as a challenge. Follow-up question: what rail assurance process addresses it?</p><p>Siemens Mobility describes checks by supplier criticality: declarations, questionnaires or supporting evidence. A stated process does not prove that a specific supplier passed it.</p><p><a href="${ASSURANCE_URL}" target="_blank" rel="noopener noreferrer">S2 · Siemens Mobility supplier assurance ↗</a></p><p class="muted">Saved one-question follow-up · official page has no publication date · checked 18 October 2026. No live request or external communication.</p></div>`:''}${state.researchStage>=2?`<div class="divider"></div><label class="field">Buyer note on this separate research<textarea data-field="researchNote" placeholder="What needs checking for your actual component or contract?">${esc(state.researchNote||'')}</textarea></label><div class="row" style="margin-top:12px"><button data-action="research-download">Download research note .md</button><span class="muted" style="font-size:12px">Source links and scope included</span></div>`:''}</div>`:!started?'<div class="notice">Load the saved example to inspect planning, evidence and a bounded follow-up. New company names require the future live research service.</div>':''}<div class="divider"></div><details class="evidence-toggle"><summary>Where System One triage could help</summary><p>Jev or the Decisions API could classify retrieved passages into evidence categories and route uncertain items for review. These labels are deterministic here. Neither model should calculate supplier risk or approve a supplier.</p></details></section>`;}

function decision(){const opts=(current)=>option('','Choose from shortlist',current)+selectedRows().map(r=>option(r[0],r[0]+' · '+r[1],current)).join('');const valid=state.ids.includes(state.preferred)&&(!state.alternate||state.ids.includes(state.alternate))&&state.preferred!==state.alternate;return `<section class="card"><div class="card-head"><div><span class="eyebrow">Buyer recommendation</span><h2>Record the reasoning, then export</h2><p>This is a draft sourcing recommendation. Qualification remains to be checked.</p></div><span class="risk" data-decision-status>${state.recorded?'Draft recorded':'Not recorded'}</span></div><div class="decision-grid"><form data-form="decision" class="decision-form"><div class="row"><label class="field">Preferred supplier<select name="preferred" data-decision="preferred">${opts(state.preferred)}</select></label><label class="field">Alternate supplier<select name="alternate" data-decision="alternate">${opts(state.alternate)}</select></label></div><label class="field">Rationale & trade-offs<textarea name="rationale" data-decision="rationale" placeholder="Explain the criteria, trade-offs and what needs further evidence…">${esc(state.rationale)}</textarea></label><label class="field">Next action<textarea name="nextAction" data-decision="nextAction">${esc(state.nextAction)}</textarea></label><label class="field">Prepared by · optional<input name="reviewer" data-decision="reviewer" value="${esc(state.reviewer)}" placeholder="Buyer or reviewer name"></label>${!valid?'<div class="notice amber">Choose a preferred supplier and a different alternate from the current shortlist.</div>':''}<div class="row"><button class="primary" type="submit">Record draft decision</button><button type="button" data-action="memo">Download memo .md</button><button type="button" data-action="csv">Download shortlist .csv</button></div><p class="muted" style="font-size:11px">Changes after recording mark the draft as unrecorded. Nothing is saved after this page closes.</p></form><aside><div class="memo-preview"><h3>Draft memo preview</h3><p style="margin-top:10px"><strong>Preferred:</strong> ${esc(state.preferred||'Not selected')}<br><strong>Alternate:</strong> ${esc(state.alternate||'Not selected')}<br><strong>Candidate set:</strong> ${state.ids.length} supplier records<br><strong>Ranking:</strong> ${esc(rankContext())}</p><div class="divider"></div><p data-draft-rationale>${esc(state.rationale||'Add your rationale to make the recommendation reviewable.')}</p><p class="muted" style="margin-top:10px" data-recorded-status>${state.recorded?'Recorded '+esc(state.recorded):'Editable draft · not an award or approval'}</p></div><h3 style="margin-top:20px">Qualification & evidence gaps</h3><ul class="unknowns"><li>Component capability and technical fit: unknown</li><li>Registration, qualification and Ready-for-Business: unknown</li><li>Price, capacity, lead time and geography: not supplied</li><li>Data as-of date and aggregate risk weights: not supplied</li><li>Any real-company mapping: unavailable</li></ul><p class="muted" style="font-size:12px">The memo includes metrics, current criteria, buyer-entered context, trade-offs, gaps, source hash and any separately reviewed research link.</p></aside></div></section>`;}
function content(){return state.view==='explore'?candidates():state.view==='compare'?compare():state.view==='ask'?ask():state.view==='research'?research():decision();}
function render(){document.body.dataset.variant=variant;const step=VIEWS.indexOf(state.view);let body='';if(variant==='A')body=`${nav()}${stateStrip()}<div class="workbench"><main>${content()}</main><aside>${state.view==='ask'?`<section class="card"><span class="eyebrow">Current evidence scope</span><h3 style="margin-top:5px">${state.ids.length} selected records</h3>${tray()}<div class="notice">Use the IDs in your question to override this set. Answers preserve the IDs used at the time of asking.</div></section>`:ask(true)}</aside></div>`;else if(variant==='B')body=`<div class="guide-layout"><aside>${nav('step-rail')}</aside><main style="min-width:0"><div class="stage-intro"><span class="eyebrow">Step ${step+1} of 5</span><h2>${TITLES[state.view]}</h2><p>${['Start with supported data fields and keep a small, persistent shortlist.','See the differences before explaining your preference.','Check the answer against the exact supplier cells.','Investigate a real company separately from anonymized risk records.','Make the judgment explicit and take a reviewable memo with you.'][step]}</p></div>${stateStrip()}${content()}<div class="guide-next">${step<4?`<button class="primary" data-action="nav" data-view="${VIEWS[step+1]}">Continue to ${TITLES[VIEWS[step+1]].toLowerCase()} →</button>`:'<button data-action="nav" data-view="explore">Return to candidate discovery</button>'}</div></main></div>`;else body=`<div class="review-layout"><div class="review-heading"><div><span class="eyebrow">Review the evidence first</span><h2>The shortlist is your starting point</h2><p class="muted">Keep the comparison in view while you investigate and decide.</p></div><div class="row"><button class="small" data-action="csv">Export shortlist CSV</button><button class="small primary" data-action="nav" data-view="decision">Write recommendation →</button></div></div>${stateStrip()}${compare(true)}<div class="review-content"><aside class="review-tools"><h3>Review workspace</h3>${VIEWS.map(v=>`<button class="${state.view===v?'active':''}" data-action="nav" data-view="${v}">${TITLES[v]}</button>`).join('')}<div class="divider"></div><p class="muted" style="font-size:12px">Selection and filters are shared across layouts. Click values above to inspect their source.</p></aside><main class="review-main">${state.view==='compare'?`<section class="card"><h2>Inspect the comparison</h2><p class="muted" style="margin-top:8px">The matrix above stays visible in this layout. Inspect a supplier to see all 19 risk scores and its operational data.</p>${tray()}<div class="row" style="margin-top:15px"><button class="primary" data-action="ask-financial">Ask lowest financial risk</button><button data-action="nav" data-view="explore">Add more candidates</button></div></section>`:content()}</main></div></div>`;
document.getElementById('app').innerHTML=`<div class="shell"><header class="heading"><div><div class="eyebrow">Sourcing / Early risk screening</div><h1>A clearer shortlist. A reviewable decision.</h1><p>Explore evidence, compare trade-offs and record your next step.</p></div><div class="row"><button class="small" data-action="reset">Reset demo</button></div></header><div class="context"><label for="project-context">Project context <span class="muted">· buyer-entered</span></label><input id="project-context" data-field="context" value="${esc(state.context)}" aria-describedby="context-note"><span id="context-note" class="muted">Context only · no component-capability data</span></div>${demo()}${body}<p class="footnote">Throwaway prototype · ${fmt(ROWS.length)} actual anonymized CSV rows · no live AI, research or microphone · no permanent storage. Source freshness and qualification are unknown.</p></div>`;
document.getElementById('variant-label').textContent=variant+' — '+VARIANTS[variant];}
let toastTimer;function toast(text){clearTimeout(toastTimer);document.getElementById('toast').textContent=text;toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',6500);}
function invalidate(){state.recorded=null;document.querySelectorAll('[data-decision-status]').forEach(el=>el.textContent='Not recorded');document.querySelectorAll('[data-recorded-status]').forEach(el=>el.textContent='Editable draft · not an award or approval');document.querySelectorAll('[data-draft-rationale]').forEach(el=>el.textContent=state.rationale||'Add your rationale to make the recommendation reviewable.');}
function toggleSelection(id,force){const exists=state.ids.includes(id);const add=force??!exists;if(add&&!exists){if(state.ids.length>=20){toast('20-supplier comparison limit reached. Remove a selected supplier before adding another.');return false;}state.ids.push(id);}else if(!add&&exists){state.ids=state.ids.filter(x=>x!==id);if(state.preferred===id)state.preferred='';if(state.alternate===id)state.alternate='';}state.answer=null;invalidate();return true;}
function askQuestion(q){state.question=q;state.answer=Core.answer(q,state.ids);}
function openDetail(id){const r=BYID.get(id)?.row;if(!r)return;const high=RISK.filter(k=>k!=='Total_Risk_Index').sort((a,b)=>val(r,b)-val(r,a)).slice(0,3);const d=document.getElementById('detail-dialog');d.innerHTML=`<div class="dialog-head"><div><div class="eyebrow">Supplier source record</div><h2 id="detail-title">${esc(r[1])}</h2><p class="mono">${id} · CSV row ${BYID.get(id).line}</p></div><button data-action="close-detail" aria-label="Close supplier details">×</button></div><div class="dialog-body"><div class="row space"><div>${risk(r,'Total_Risk_Index')}<span class="muted"> total risk / 100</span></div><button class="small" data-action="select-detail" data-id="${id}">${state.ids.includes(id)?'Remove from shortlist':'Add to shortlist'}</button></div><div class="notice">0 = no risk · 100 = maximum risk for every risk score, including Financial Health and ESG. Source weights are unknown; high categories below are observations, not contributions.</div><h3>Highest observed category values</h3><p style="margin-top:8px">${high.map(k=>esc(label(k))+' '+val(r,k)).join(' · ')}</p><h3 style="margin-top:22px">All 19 risk metrics</h3><div class="detail-metrics">${RISK.map(k=>`<div class="detail-metric"><div><button data-action="source" data-id="${id}" data-key="${k}">${label(k)}</button><div class="scorebar"><i style="width:${val(r,k)}%"></i></div></div><div style="white-space:nowrap">${risk(r,k)}</div></div>`).join('')}</div><h3 style="margin-top:23px">Operational metrics · not risk scores</h3><div class="detail-metrics">${[...OPS,'Sourcing Risk Level','Supply Chain Complexity'].map(k=>`<div class="detail-metric"><button data-action="source" data-id="${id}" data-key="${k}">${k}</button><strong>${typeof val(r,k)==='number'?fmt(val(r,k),2):esc(val(r,k))}${OPS.includes(k)&&!k.includes('EUR')?'%':''}</strong></div>`).join('')}</div><div class="notice">Technical capability, legal company identity, geography and qualification: unknown. No current-event facts are available in this row.</div>${evidence([id],['Total_Risk_Index','Financial_Health_Score','ESG_Performance_Score'])}</div>`;if(!d.open)d.showModal();}
function openSource(id,key){const entry=BYID.get(id);if(!entry||!(key in C))return;const r=entry.row;const d=document.getElementById('source-dialog');d.innerHTML=`<div class="dialog-head"><div><span class="eyebrow">Exact source cell</span><h2 id="source-title">${esc(label(key))}</h2></div><button data-action="close-source" aria-label="Close source evidence">×</button></div><div class="dialog-body"><dl class="source-meta"><dt>Observed value</dt><dd style="font-size:24px;font-weight:650">${esc(val(r,key))}${RISK.includes(key)?' / 100':''}</dd>${RISK.includes(key)?'<dt>Source risk label</dt><dd>'+esc(val(r,key+'_Level'))+'</dd>':''}<dt>Supplier</dt><dd>${id} · ${esc(r[1])}</dd><dt>File / physical row / column</dt><dd>${DATA.source}<br>CSV row ${entry.line} (header is row 1)<br>Column ${C[key]+1}: <span class="mono">${esc(key)}</span></dd><dt>Definition / interpretation</dt><dd>${esc(DEFS[key]||(RISK.includes(key)?'Source risk index: 0 = no risk; 100 = maximum risk. This number does not identify specific underlying events.':'Supplied operational / supply-chain field.'))}</dd><dt>Source SHA256</dt><dd class="mono">${DATA.sha256}</dd><dt>Data as-of</dt><dd>Not supplied. A source hash identifies this snapshot, not its freshness.</dd></dl></div>`;if(!d.open)d.showModal();}
function switchVariant(delta){const keys=Object.keys(VARIANTS);variant=keys[(keys.indexOf(variant)+delta+3)%3];const url=new URL(location.href);url.searchParams.set('variant',variant);try{history.replaceState({},'',url);}catch(e){/* Some file browsers disallow local history replacement. */}render();toast('Layout '+variant+' · '+VARIANTS[variant]+'. Selection, criteria and notes retained.');}
function clearFilters(){Object.assign(state,{q:'',level:'',sourcing:'',complexity:'',delivery:'',page:1});invalidate();}
function researchStart(name){state.company=name;state.researchStage=1;state.followup=false;state.researchNote='';invalidate();}
function draftDemo(){state.view='decision';state.preferred='SUPP_00731';state.alternate='SUPP_00012';state.rationale='Prefer SUPP_00731 for further investigation: financial risk is 53 versus 54 and 65 in the comparison set, and total risk is 57. Credit rating risk remains Critical at 76. Delivery is 85.02%, slightly below the other two candidates. This is an early risk shortlist; technical capability and qualification need evidence.';invalidate();}
function validDecision(){if(!state.ids.includes(state.preferred)){toast('Choose a preferred supplier from your current shortlist.');return false;}if(state.alternate&&(!state.ids.includes(state.alternate)||state.alternate===state.preferred)){toast('Choose a different alternate from your current shortlist, or leave it empty.');return false;}if(!state.rationale.trim()){toast('Add your rationale and trade-offs before recording or downloading the memo.');return false;}return true;}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);}
function exportMemo(){if(!validDecision()){state.view='decision';render();return;}const stamp=new Date().toISOString();const rows=selectedRows();const clean=s=>String(s).replace(/\r/g,'').replace(/\|/g,'\\|');const lines=['# Draft supplier shortlist memo','','Status: Buyer draft — not qualification, approval or award.','Generated: '+stamp,'Prepared by: '+(state.reviewer||'Not specified'),'Recorded draft: '+(state.recorded||'Not recorded'),'', '## Buyer-entered context',state.context,'','## Recommendation','Preferred: '+state.preferred,'Alternate: '+(state.alternate||'None selected'),'',state.rationale,'','Next action: '+state.nextAction,'','## Candidate criteria','Filters: '+filterContext(),'Numeric ranking: '+rankContext(),'Selected supplier IDs: '+state.ids.join(', '),'Selection persists across filters; the shortlist may include records outside the current filtered result.','','## Comparison facts','Risk scores: 0 = no risk, 100 = maximum risk. Source risk labels are preserved.','','| Supplier | Total risk | Financial risk | ESG risk | Delivery % | Confirmation % | PO exposure EUR |','| --- | --- | --- | --- | --- | --- | --- |',...rows.map(r=>'| '+[r[0]+' · '+r[1],val(r,'Total_Risk_Index')+' / '+val(r,'Total_Risk_Index_Level'),val(r,'Financial_Health_Score')+' / '+val(r,'Financial_Health_Score_Level'),val(r,'ESG_Performance_Score')+' / '+val(r,'ESG_Performance_Score_Level'),val(r,'Supplier Delivery Rating'),val(r,'Order Confirmation Rate'),val(r,'Purchase Order Volume (EUR)')].map(clean).join(' | ')+' |'),'','## Full risk profile'];for(const r of rows){lines.push('', '### '+r[0]+' · '+r[1],...RISK.map(k=>'- '+k+': '+val(r,k)+' / '+val(r,k+'_Level')),...['Order Change Rate','Sourcing Risk Level','Supply Chain Complexity'].map(k=>'- '+k+': '+val(r,k)),'Source CSV row: '+BYID.get(r[0]).line);}lines.push('','## Qualifications and unknowns','- Component capability, technical fit, capacity, lead time, geography and unit price are not supplied.','- Registration, qualification and Ready-for-Business status are unknown.','- Total-risk weights and data as-of date are not supplied. High values cannot establish exact causal contributions.','- PO volume is historical exposure, not a quote. Operational percentages are not risk scores.','- No mapping exists between anonymized supplier IDs and real companies.','','## Separate company research');if(state.researchStage&&/^siemens\s+ag$/i.test(state.company.trim()))lines.push(...researchLines());else lines.push(state.company?'Entered company: '+state.company+'. No offline fixture available; no facts generated.':'No separate company research reviewed.');lines.push('','## Data provenance','Source: '+DATA.source,'SHA256: '+DATA.sha256,'Rows: '+ROWS.length,'Metric dictionary: docs/risk_criteria_description.md','Supplier row numbers above include the CSV header as row 1.','Public workflow context: https://static.sw.cdn.siemens.com/siemens-disw-assets/public/5rxr5cj9Eqa104a1vsli5B/en-US/siemens-sustainable-procurement.pdf','','Offline throwaway prototype. All recommendation text is buyer-entered or editable demo text. No permanent storage, AI inference, microphone capture or real-system write.');download('supplier-shortlist-memo.md',lines.join('\n'),'text/markdown;charset=utf-8');toast('Draft memo downloaded with metrics, criteria, unknowns and source provenance.');}
function exportCSV(){if(!state.ids.length){toast('Select at least one supplier to export.');return;}const cell=v=>{let s=String(v??'');if(/^[\s]*[=+\-@]/.test(s)||/^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const extra=['Data source SHA256','CSV physical row','Current filters','Numeric ranking','Buyer context','Draft preferred','Draft alternate','Buyer rationale','Next action'];const csv=[DATA.columns.concat(extra),...selectedRows().map(r=>r.concat([DATA.sha256,BYID.get(r[0]).line,filterContext(),rankContext(),state.context,state.preferred,state.alternate,state.rationale,state.nextAction]))].map(r=>r.map(cell).join(',')).join('\r\n');download('supplier-shortlist.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast(state.ids.length+' supplier rows downloaded with source fields and decision context.');}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;switch(a){case'nav':state.view=b.dataset.view;render();break;case'reset':state=initial();render();toast('Reset to the three-supplier baseline. All session notes cleared.');break;case'variant-prev':switchVariant(-1);break;case'variant-next':switchVariant(1);break;case'clear-filters':clearFilters();render();break;case'page-prev':state.page--;render();break;case'page-next':state.page++;render();break;case'clear-selection':state.ids=[];state.preferred='';state.alternate='';state.answer=null;invalidate();render();break;case'remove':toggleSelection(id,false);render();break;case'detail':openDetail(id);break;case'select-detail':toggleSelection(id);render();openDetail(id);break;case'close-detail':document.getElementById('detail-dialog').close();break;case'source':openSource(id,b.dataset.key);break;case'close-source':document.getElementById('source-dialog').close();break;case'toggle-metrics':state.allMetrics=!state.allMetrics;render();break;case'ask-financial':askQuestion('Which selected supplier has the lowest financial risk?');state.view='ask';render();break;case'ask-high':askQuestion('Why is SUPP_00018 high risk?');state.view='ask';render();break;case'inspect-high':openDetail('SUPP_00018');break;case'dictation':state.dictation=true;render();break;case'cancel-transcript':state.dictation=false;render();break;case'use-transcript':state.question=state.transcript;state.dictation=false;render();document.getElementById('question-input')?.focus();toast('Transcript copied. Review it, then choose Ask the data.');break;case'research-example':researchStart('Siemens AG');render();break;case'research-advance':state.researchStage=Math.min(3,state.researchStage+1);invalidate();render();break;case'followup':state.followup=true;invalidate();render();toast('Saved follow-up opened. No live retrieval or request was sent.');break;case'research-download':download('company-research-example.md',researchLines().join('\n'),'text/markdown;charset=utf-8');break;case'memo':exportMemo();break;case'csv':exportCSV();break;case'demo-start':state=initial();state.demo='journey';render();break;case'demo-cap':state=initial();state.ids=ROWS.slice(0,20).map(r=>r[0]);state.preferred=state.ids[0];state.alternate=state.ids[1];state.demo='limit';toggleSelection(ROWS[20][0],true);render();toast('20 selected. Adding '+ROWS[20][0]+' was blocked. Remove one, then try adding another.');break;case'demo-unsupported':state=initial();state.demo='unsupported';state.view='ask';askQuestion('Which supplier is qualified for railway door systems?');render();break;case'demo-next':if(state.demoStep>=9){state=initial();state.demo='journey';render();break;}switch(state.demoStep){case 0:state.view='compare';break;case 1:state.view='ask';state.dictation=true;break;case 2:state.question=state.transcript;state.dictation=false;askQuestion(state.question);break;case 3:openDetail('SUPP_00018');break;case 4:state.view='research';researchStart('Siemens AG');break;case 5:state.researchStage=2;invalidate();break;case 6:state.researchStage=3;state.followup=true;invalidate();toast('Example review complete. Simulated follow-up drafted; no request sent.');break;case 7:draftDemo();break;case 8:exportMemo();break;}state.demoStep++;render();break;}});
let searchTimer;document.addEventListener('input',event=>{const el=event.target;if(el.matches('[name="question"]')){state.question=el.value;return;}if(el.dataset.decision){state[el.dataset.decision]=el.value;invalidate();return;}const key=el.dataset.field;if(!key)return;state[key]=el.value;if(key==='q'){state.page=1;invalidate();clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const start=el.selectionStart,end=el.selectionEnd;render();const next=document.getElementById('supplier-search');next?.focus();if(next?.setSelectionRange)next.setSelectionRange(start,end);},220);}else if(key==='context'||key==='researchNote'){invalidate();}else if(key==='delivery'){invalidate();}});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.select){const okay=toggleSelection(el.dataset.select,el.checked);if(!okay)el.checked=false;render();return;}if(el.dataset.decision){state[el.dataset.decision]=el.value;invalidate();if(el.tagName==='SELECT')render();return;}const key=el.dataset.field;if(key&&['level','sourcing','complexity','delivery','sort','direction'].includes(key)){state[key]=el.value;if(key==='delivery'&&state.delivery!=='')state.delivery=String(Math.max(0,Math.min(100,Number(state.delivery)||0)));state.page=1;invalidate();render();}});
document.addEventListener('submit',event=>{const form=event.target;if(!form.dataset.form)return;event.preventDefault();const data=new FormData(form);if(form.dataset.form==='ask'){askQuestion(String(data.get('question')));render();}else if(form.dataset.form==='research'){researchStart(String(data.get('company')).trim());render();}else if(form.dataset.form==='decision'){for(const key of ['preferred','alternate','rationale','nextAction','reviewer'])state[key]=String(data.get(key)||'');if(validDecision()){state.recorded=new Date().toISOString();render();toast('Draft decision recorded in this session. Download a memo to keep it.');}}});
document.addEventListener('keydown',event=>{if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight')return;if(event.target.closest('input,textarea,select,[contenteditable="true"]')||document.querySelector('dialog[open]'))return;event.preventDefault();switchVariant(event.key==='ArrowLeft'?-1:1);});
window.addEventListener('popstate',()=>{const v=new URLSearchParams(location.search).get('variant');if(VARIANTS[v]){variant=v;render();}});
window.Workbench={get state(){return state;},Core,DATA,render,openDetail,openSource,exportMemo,exportCSV};
render();
</script></body></html>
